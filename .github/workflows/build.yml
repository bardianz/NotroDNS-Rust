name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: fmt, clippy, test, build (Windows x64 Release)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - name: Run tests
        run: cargo test --all --target x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc --bin notrodns

      - name: Locate built executable
        id: locate
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/notrodns.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected executable not found at $exe"
          }
          Write-Host "Found $exe"
          "exe_path=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: NotroDNS-Windows-x64
          path: ${{ steps.locate.outputs.exe_path }}
          if-no-files-found: error
